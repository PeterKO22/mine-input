# mine-input AI Hub（W4 骨架）
#
# 用法：
#   ./tls/gen-certs.sh               # 一次性：自签 CA + HTTPS 证书（W17，产物 tls/certs/）
#   docker compose up -d --build     # 起 Hub（FastAPI + SQLite）+ nginx TLS 边车
#   ./smoke.sh                       # 全链路 curl 冒烟（默认 https://localhost:8443，CA 验证）
#   ./backup.sh && ./restore.sh      # 数据备份/恢复（SQLite + secret，W17）
#   docker compose down              # 停（数据在 hub-data 卷，不丢）
#
# 模型服务是占位（档位已定：7B Q4，见 docs/技术方案-v0.4.md §13 T2 结论），
# 本任务不下模型。启用方式见下方 llama 服务注释与 hub/README.md。

services:
  hub:
    build: .
    image: mine-input-hub:latest
    container_name: mine-input-hub
    ports:
      # W17：HTTP 明文降级为「可选回退」，默认只绑 loopback（本机调试/回退用）；
      # 对外服务一律走 tls 边车 HTTPS（:8443）。要重新开放明文局域网访问：
      #   HUB_HTTP_BIND=0.0.0.0 docker compose up -d
      # 可用 HUB_PORT 环境变量覆盖端口：HUB_PORT=8080 docker compose up -d --build
      - "${HUB_HTTP_BIND:-127.0.0.1}:${HUB_HTTP_PORT:-8088}:8080"
    environment:
      HUB_DATA_DIR: /data
      # W13：/v1/suggest 模型后端地址可切（两档）：
      #   默认档 = 宿主机原生 7B（models/run-llama-native.sh start，宿主端口 8092；
      #   Docker 内访问宿主机统一走 host.docker.internal）
      #   降级档 = compose 内 0.5B（先 docker compose --profile model up -d llama，再：
      #     MODEL_URL=http://llama:8091 MODEL_NAME=qwen2.5-0.5b-instruct-q4_k_m docker compose up -d hub）
      MODEL_URL: ${MODEL_URL:-http://host.docker.internal:8092}
      # 与实际档位同步（done 帧 model 字段诚实标注）；两档对应值见上
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-7b-instruct-q4_k_m}
      # 模型不可达时降级流式桩（done 帧 backend=stub-fallback，不冒充真模型）；置 0 关闭
      SUGGEST_ALLOW_STUB_FALLBACK: ${SUGGEST_ALLOW_STUB_FALLBACK:-1}
    volumes:
      # SQLite 卷布局（静态加密预留，见 README「卷布局与加密预留」）：
      #   /data/hub.db      用户与同步数据（SQLite，WAL）
      #   /data/hub-secret  Hub 服务签名密钥（token HMAC）
      - hub-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- nginx TLS 边车【W17】HTTPS 终结 → hub:8080 --------------------------
  # 自签 CA + server 证书：先 ./tls/gen-certs.sh（产物在 ./tls/certs/，私钥不入库）。
  # 对外统一 https://<host>:8443（客户端装 tls/certs/ca.crt 即可验证）；
  # HTTP 明文保留为可选回退（hub 服务端口，默认只绑 127.0.0.1）。
  tls:
    image: nginx:alpine
    container_name: mine-input-tls
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "${HUB_TLS_PORT:-8443}:443"
    volumes:
      # 整目录挂载（文件原子替换不烂挂载）：nginx.conf 被 /etc/nginx/conf.d/*.conf 包含
      - ./tls:/etc/nginx/conf.d:ro
      - ./tls/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      # alpine 镜像带 busybox wget；证书是自签，跳过校验探活（对外验证在客户端侧）
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- llama.cpp 模型服务【0.5B 降级档】（W10 启用；W13 起为降级档）----------
  # W13 起默认后端 = 宿主机原生 7B（models/run-llama-native.sh，宿主端口 8092，
  # 宿主 128GB 统一内存跑 7B Q4_K_M 无压力）；本服务仅作容器内降级档
  # （Docker VM 内存 7.75GB，只装得下 ≤500MB 的 0.5B；7B 在 VM 内 OOM，见 W10-REPORT §7）。
  # 模型在 repo 根 models/（大文件不入库，models/fetch_model.sh 可复现拉取 + 校验）。
  #
  # 启用降级档（--profile model；端口 8091：本机 8088=Hub、8080/8000/8090 均被占用）：
  #   ./models/fetch_model.sh install        # 模型灌入 hub-models 卷
  #   docker compose --profile model up -d llama
  #   MODEL_URL=http://llama:8091 MODEL_NAME=qwen2.5-0.5b-instruct-q4_k_m docker compose up -d hub
  llama:
    profiles: ["model"]        # 不加 --profile model 不会启动、不会拉镜像
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: mine-input-llama
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8091"
      - "-m"
      # 模型档位可换（drop-in，见 README「模型灌入/换模型」）：
      #   默认：qwen2.5-0.5b-instruct-q4_k_m.gguf（491MB，本机 Docker VM 内存受限可跑）
      #   目标档 7B Q4_K_M（split 分片喂第一片）：MODEL_FILE=qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
      #   ⚠️ 7B 需 Docker Desktop VM ≥8GB（建议 16GB）内存，现状 7.75GB 且被共驻服务占 ~3.5GB → OOM
      - "/models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}"
      - "-c"
      - "2048"
    ports:
      - "8091:8091"
    volumes:
      # 模型经命名卷分发（VirtioFS bind-mount 的 mmap 在 Docker Desktop VM 内存受限时会
      # OOM，实测见 W10-REPORT；命名卷 ext4 页缓存可回收）。灌入方式见 README「模型灌入」。
      - hub-models:/models
    healthcheck:
      # 镜像自带 healthcheck 探 localhost:8080（默认端口），本服务走 8091，覆盖之
      test: ["CMD", "curl", "-sf", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  hub-data:
  hub-models:   # llama.cpp 模型卷（W10 启用；灌入方式见 README「模型灌入」）
