# mine-input Hub HTTPS 终结（W17）：nginx 边车 —— TLS 在此终结，反代 hub:8080。
# 由 docker-compose.yml 的 tls 服务挂载（./tls → /etc/nginx/conf.d + ./tls/certs）。
# SSE 流式逐帧透传的关键：proxy_buffering off + Connection 置空 + 长 read 超时。
#
# ⚠️ 证书须 RSA（gen-certs.sh 已固定 RSA-2048）：macOS 系统 curl/LibreSSL 3.3.6 对
#    OpenSSL 3.x 的 TLS 1.3 + ECDSA leaf 会握手失败（tlsv1 alert decode error），
#    定位与规避见 W17-REPORT §5；勿换回 EC leaf。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 个人/朋友场景轻量安全基线
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # SSE 流式建议（/v1/suggest）逐帧直通，不缓冲、不压
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
