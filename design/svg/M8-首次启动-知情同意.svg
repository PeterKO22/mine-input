<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840"><defs><filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowRed" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="hudGrid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#0E2924"/><path d="M8 0H0V8" fill="none" stroke="#2B4B44" stroke-width="0.5" opacity="0.6"/></pattern></defs><rect width="1280" height="840" fill="#0E2924"/><rect x="0" y="0" width="1280" height="4" rx="0" fill="#D4A857" stroke="none" stroke-width="1" /><text x="28" y="48" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="22" fill="#E0E6E4" font-weight="700" text-anchor="start" >M8 · 首次启动 — 知情同意流程（macOS）</text><text x="28" y="72" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#8A9E99" font-weight="400" text-anchor="start" >逐项分级同意 · 默认只有 C0 开 · 高敏项必须显式勾选</text><text x="28" y="120" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="26" fill="#E0E6E4" font-weight="700" text-anchor="start" >首次启动 · 知情同意</text><text x="28" y="148" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#8A9E99" font-weight="400" text-anchor="start" >屏幕与音频采集属于高敏权限，逐项明示、逐项同意 —— 没有「默认全开」</text><circle cx="38" cy="184" r="10" fill="#2B4B44"/><text x="58" y="189" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#8A9E99" font-weight="400" text-anchor="start" >1 欢迎</text><line x1="148" y1="184" x2="228" y2="184" stroke="#2B4B44" stroke-width="2"/><circle cx="258" cy="184" r="10" fill="#D4A857"/><text x="278" y="189" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#E0E6E4" font-weight="600" text-anchor="start" >2 采集分级</text><line x1="368" y1="184" x2="448" y2="184" stroke="#2B4B44" stroke-width="2"/><circle cx="478" cy="184" r="10" fill="#2B4B44"/><text x="498" y="189" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#8A9E99" font-weight="400" text-anchor="start" >3 数据去向</text><rect x="28" y="220" width="388" height="320" rx="14" fill="#18352F" stroke="#2B4B44" stroke-width="1" /><text x="52" y="260" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="17" fill="#E0E6E4" font-weight="700" text-anchor="start" >C0 · 基础上下文</text><rect x="52" y="276" width="42" height="22" rx="11.0" fill="#1B3E37" stroke="#388A83" stroke-width="1" /><text x="73.0" y="290.96" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#388A83" font-weight="500" text-anchor="middle" >推荐</text><text x="52" y="332" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 输入框前后文、当前应用名</text><text x="52" y="356" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 最近输入历史（本机）</text><text x="52" y="380" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 用途：候选排序、基础联想</text><text x="52" y="404" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 数据：仅本机 + 你的 Hub</text><rect x="352" y="248" width="40" height="22" rx="11" fill="#D4A857" stroke="none" stroke-width="1" /><circle cx="381" cy="259" r="8" fill="#E0E6E4"/><text x="52" y="508" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#4CB368" font-weight="500" text-anchor="start" >默认开启 · 可随时关</text><rect x="446" y="220" width="388" height="320" rx="14" fill="#18352F" stroke="#2B4B44" stroke-width="1" /><text x="470" y="260" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="17" fill="#E0E6E4" font-weight="700" text-anchor="start" >C1 · 屏幕 + 音频</text><rect x="470" y="276" width="42" height="22" rx="11.0" fill="#263730" stroke="#A84B3D" stroke-width="1" /><text x="491.0" y="290.96" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#A84B3D" font-weight="500" text-anchor="middle" >高敏</text><text x="470" y="332" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 按下键盘时屏幕快照 → OCR</text><text x="470" y="356" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 系统音频转写（环境理解）</text><text x="470" y="380" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 用途：上下文建议、动态提词</text><text x="470" y="404" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 密码框自动暂停 · 一键熔断</text><rect x="770" y="248" width="40" height="22" rx="11" fill="#2B4B44" stroke="none" stroke-width="1" /><circle cx="781" cy="259" r="8" fill="#E0E6E4"/><text x="470" y="508" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#A84B3D" font-weight="500" text-anchor="start" >默认关闭 · 明确同意后开启</text><rect x="864" y="220" width="388" height="320" rx="14" fill="#18352F" stroke="#2B4B44" stroke-width="1" /><text x="888" y="260" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="17" fill="#E0E6E4" font-weight="700" text-anchor="start" >数据去向</text><rect x="888" y="276" width="64" height="22" rx="11.0" fill="#273E32" stroke="#D4A857" stroke-width="1" /><text x="920.0" y="290.96" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#D4A857" font-weight="500" text-anchor="middle" >你的地盘</text><text x="888" y="332" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 设备 ──TLS──▶ 你的 AI Hub</text><text x="888" y="356" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· Hub 在你自己家/服务器上</text><text x="888" y="380" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 可选 E2E：Hub 也看不到明文</text><text x="888" y="404" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 不经过任何第三方云</text><text x="888" y="428" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="12" fill="#8A9E99" font-weight="400" text-anchor="start" >· 一键导出 / 一键清空</text><rect x="1188" y="248" width="40" height="22" rx="11" fill="#D4A857" stroke="none" stroke-width="1" /><circle cx="1217" cy="259" r="8" fill="#E0E6E4"/><text x="888" y="508" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="11" fill="#4CB368" font-weight="500" text-anchor="start" >默认开启 · 可随时关</text><rect x="28" y="576" width="1224" height="88" rx="14" fill="#18352F" stroke="#2B4B44" stroke-width="1" /><text x="52" y="610" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#C8D0CC" font-weight="400" text-anchor="start" >我已理解：mine-input 会记录我的输入与屏幕/音频上下文，数据仅存于我的设备与我的 Hub，</text><text x="52" y="634" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#C8D0CC" font-weight="400" text-anchor="start" >我可随时在「采集与上下文」中调整或熔断。</text><rect x="872" y="596" width="168" height="44" rx="22" fill="#0E2924" stroke="#2B4B44" stroke-width="1" /><text x="956" y="623" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#C8D0CC" font-weight="500" text-anchor="middle" >仅使用基础功能</text><rect x="1056" y="596" width="172" height="44" rx="22" fill="#D4A857" stroke="#D4A857" stroke-width="1" filter="url(#glowGold)"/><text x="1142" y="623" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="13" fill="#0E2924" font-weight="600" text-anchor="middle" >同意并继续</text></svg>