# Rime default settings（W1 dev 用户目录版）
# encoding: utf-8
#
# 基于 rime-prelude default.yaml（pinned，见 build/fetch-schema-deps.sh）：
#   - schema_list 只挂 ping_wubi_mixed（dev 目录独立，不读用户已有方案）
#   - menu/page_size = 8（需求 D 台账：候选 6–8）
# 其余段与上游 prelude 保持一致，key_binder/selector 依赖 key_bindings.yaml，
# punctuator 依赖 punctuation.yaml（均随 fetch-schema-deps.sh 落到本目录）。

config_version: '0.50'

schema_list:
  - schema: ping_wubi_mixed

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 8

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

selector:
  __patch:
    bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/bindings:
      __include: key_bindings:/rotate_candidate_with_tab
    vertical/linear/bindings:
      __include: key_bindings:/rotate_candidate_with_tab

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
